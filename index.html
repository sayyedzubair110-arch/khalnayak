<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rizwan Gaming Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav>
        <h1>Rizwan Gaming Store</h1>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Games</a></li>
            <li><a href="#">Accessories</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
</header>

<section class="hero">
    <h2>Welcome to Karachi's Gaming Hub</h2>
    <p>Buy GTA V, PS5 Games, Xbox Games & Gaming Accessories</p>
    <button id="shopBtn">Shop Now</button>
</section>

<section class="products">
    <h2>Featured Games</h2>

    <div class="product-card">
        <img src="https://via.placeholder.com/250x150" alt="GTA V">
        <h3>GTA V</h3>
        <p>PKR 3,500</p>
        <button>Add to Cart</button>
    </div>

    <div class="product-card">
        <img src="https://via.placeholder.com/250x150" alt="FC 25">
        <h3>FC 25</h3>
        <p>PKR 8,000</p>
        <button>Add to Cart</button>
    </div>

    <div class="product-card">
        <img src="https://via.placeholder.com/250x150" alt="Spider-Man 2">
        <h3>Spider-Man 2</h3>
        <p>PKR 10,000</p>
        <button>Add to Cart</button>
    </div>
</section>

<footer>
    <p>📍 Punjab Colony, Karachi, Pakistan</p>
    <p>© 2026 Rizwan Gaming Store</p>
</footer>

<script src="script.js"></script>
</body>
</html>
